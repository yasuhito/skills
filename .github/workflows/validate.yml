name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested files and local links
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          expected = {
              "skills/create-verification-skill/SKILL.md",
              "skills/create-verification-skill/references/feature-map-example/README.md",
              "skills/create-verification-skill/references/feature-map-example/create-note.md",
              "skills/create-verification-skill/references/feature-map-example/search.md",
              "skills/maintain-verification-skill/SKILL.md",
          }
          actual = {str(path) for path in Path("skills").rglob("*.md")}
          if actual != expected:
              raise SystemExit(
                  f"Markdown coverage mismatch: missing={expected - actual}, extra={actual - expected}"
              )

          for path_string in expected:
              path = Path(path_string)
              for target in re.findall(r"\[[^]]+\]\(([^)]+)\)", path.read_text()):
                  if "://" not in target and not target.startswith("#"):
                      resolved = (path.parent / target).resolve()
                      if not resolved.exists():
                          raise SystemExit(f"Broken local link in {path}: {target}")
          PY
      - name: Validate skill frontmatter
        shell: ruby {0}
        run: |
          require "yaml"

          expected = {
            "skills/create-verification-skill/SKILL.md" => "create-verification-skill",
            "skills/maintain-verification-skill/SKILL.md" => "maintain-verification-skill",
          }

          expected.each do |path, name|
            content = File.read(path)
            match = content.match(/\A---\n(.*?)\n---\n/m)
            abort "Missing YAML frontmatter: #{path}" unless match

            frontmatter = YAML.safe_load(match[1])
            abort "Invalid name in #{path}" unless frontmatter["name"] == name
            description = frontmatter["description"]
            abort "Missing description in #{path}" unless description.is_a?(String) && !description.empty?
            abort "Invalid disable-model-invocation in #{path}" unless frontmatter["disable-model-invocation"] == true
          end
